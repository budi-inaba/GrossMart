<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GrossMart - Sistem Informasi Pengelolaan</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons via CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="styles.css" />

  <!-- POS Styles -->
  <link rel="stylesheet" href="pos.css" />
  
</head>
<body class="bg-slate-50 font-sans text-slate-800 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-teal-700 text-white sticky top-0 z-10 shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      
      <div class="flex items-center gap-3">
        <!-- Logo dengan Ring Animation -->
        <div class="relative">
          <div class="absolute inset-0 bg-teal-400 rounded-2xl animate-ping opacity-20"></div>
          <div class="relative w-20 h-8 bg-white/95 backdrop-blur-sm rounded-2xl flex items-center justify-center shadow-lg border border-teal-200">
            <img src="asset/logo-rptra.png" alt="Logo RPTRA" class="w-16 h-16 object-contain" />
          </div>
        </div>
        <div class="absolute -top-1 -left-1 flex space-x-0.5">
          <div class="w-2 h-2 bg-red-500 rounded-full animate-pulse"></div>
          <div class="w-2 h-2 bg-yellow-500 rounded-full animate-pulse delay-75"></div>
          <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse delay-150"></div>
        </div>
      </div>
  
  <div>
    <h1 class="text-lg font-bold leading-tight text-white">GrossMart</h1>
    <p class="text-xs text-teal-200 font-medium">Sistem Informasi Pengelolaan</p>
  </div>
</div>
      <div class="flex items-center gap-3">
        <button class="p-2 bg-teal-600 hover:bg-teal-500 rounded-full transition-colors relative" id="notifBtn">
          <i data-lucide="bell" class="w-[18px] h-[18px]"></i>
          <span class="absolute top-0 right-0 w-2.5 h-2.5 bg-rose-500 border-2 border-teal-600 rounded-full"></span>
        </button>
        <button class="p-1 bg-teal-600 hover:bg-teal-500 rounded-full transition-colors">
          <i data-lucide="user-circle" class="w-[28px] h-[28px]"></i>
        </button>
      </div>
    </div>
    
    <!-- Decorator line mimicking the PPT banner -->
    <div class="h-2 w-full flex" id="decoratorLine"></div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-1 w-full max-w-7xl mx-auto p-4 md:p-6 overflow-x-hidden" id="mainContent">
    <!-- Content will be injected here by JavaScript -->
  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 pb-safe z-50 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
    <div class="max-w-md mx-auto flex justify-between px-2 py-2" id="bottomNav">
      <!-- Nav items will be injected here by JavaScript -->
    </div>
  </nav>

  <!-- Custom JavaScript -->
  <script src="script.js"></script>
  <!-- POS Module -->
  <script src="pos.js"></script>
</body>
</html>
